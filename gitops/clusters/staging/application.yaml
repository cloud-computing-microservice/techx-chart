apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: techx-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cloud-computing-microservice/techx-chart.git
    targetRevision: main
    path: .
    helm:
      valueFiles:
        - values-staging.yaml
        - values-domain-vpn.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: techx-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
