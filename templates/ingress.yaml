{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  labels:
    {{- include "techx.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    {{- if eq .Values.ingress.profile "domainVpn" }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.groupName | quote }}
    alb.ingress.kubernetes.io/group.order: {{ .Values.ingress.groupOrder | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: {{ index .Values.ingress.annotations "alb.ingress.kubernetes.io/healthcheck-interval-seconds" | quote }}
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: {{ index .Values.ingress.annotations "alb.ingress.kubernetes.io/healthcheck-timeout-seconds" | quote }}
    alb.ingress.kubernetes.io/healthy-threshold-count: {{ index .Values.ingress.annotations "alb.ingress.kubernetes.io/healthy-threshold-count" | quote }}
    alb.ingress.kubernetes.io/success-codes: "200"
    {{- else }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.workloads.frontend.port }}
{{- end }}
